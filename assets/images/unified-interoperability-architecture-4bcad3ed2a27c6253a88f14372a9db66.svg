<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="950" viewBox="0 0 2000 950" role="img" aria-labelledby="t d">
<title id="t">Unified interoperability architecture</title>
<desc id="d">Consumers (members, providers, payers) exchange data with a healthcare organization platform that provides security and identity management, data management, workflows, observability and analytics, API management and integration, and AI and agent management. The platform connects to systems of record: claim management systems, CRM, ERP and billing, health information networks, SaaS backends, and custom data sources.</desc>
