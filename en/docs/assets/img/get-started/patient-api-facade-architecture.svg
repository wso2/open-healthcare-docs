<svg xmlns="http://www.w3.org/2000/svg" width="380" height="200" viewBox="0 0 380 200" role="img" aria-labelledby="title desc">
  <title id="title">Patient API facade architecture</title>
  <desc id="desc">Client calls the Ballerina Patient API facade on port 9091, which validates and enriches requests before forwarding them to the WSO2 FHIR Server repository on port 9090.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5567d5"/>
    </marker>
  </defs>
  <rect width="380" height="200" fill="#ffffff"/>

  <rect x="115" y="6" width="150" height="30" rx="15" fill="#ffffff" stroke="#5567d5" stroke-width="1.5"/>
  <text x="190" y="26" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1a1e2e">Client</text>

  <line x1="190" y1="36" x2="190" y2="54" stroke="#5567d5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="198" y="50" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#5a6275">FHIR requests</text>

  <rect x="55" y="58" width="270" height="44" rx="8" fill="#ffffff" stroke="#5567d5" stroke-width="1.5"/>
  <text x="190" y="76" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1a1e2e">Ballerina Patient API facade</text>
  <text x="190" y="93" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#5a6275">:9091</text>

  <line x1="190" y1="102" x2="190" y2="120" stroke="#5567d5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="198" y="116" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#5a6275">validate / enrich</text>

  <rect x="55" y="124" width="270" height="44" rx="8" fill="#ffffff" stroke="#5567d5" stroke-width="1.5"/>
  <text x="190" y="142" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1a1e2e">WSO2 FHIR Server repository</text>
  <text x="190" y="159" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#5a6275">:9090/fhir/r4</text>
</svg>
